[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckTimeout = 300
startCommand = "echo 'Starting...' && npx prisma migrate deploy 2>&1 && echo 'Migration OK' && node dist/main 2>&1 || echo 'CRASHED with exit code' $?"
