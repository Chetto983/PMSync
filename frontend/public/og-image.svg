<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PMSync - AI workspace for inbox teams</title>
  <desc id="desc">Open graph image for PMSync with balanced headline and product preview panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071327" />
      <stop offset="52%" stop-color="#0e1e3e" />
      <stop offset="100%" stop-color="#1c1141" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5bd2ea" />
      <stop offset="50%" stop-color="#7760d9" />
      <stop offset="100%" stop-color="#c14ab5" />
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#030812" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1080" cy="120" r="190" fill="#5bd2ea" fill-opacity="0.18" filter="url(#blur)" />
  <circle cx="150" cy="560" r="220" fill="#c14ab5" fill-opacity="0.18" filter="url(#blur)" />
  <circle cx="560" cy="40" r="160" fill="#7760d9" fill-opacity="0.14" filter="url(#blur)" />

  <rect x="46" y="44" width="1108" height="542" rx="34" fill="#0d1934" fill-opacity="0.9" stroke="#6d88be" stroke-opacity="0.28" filter="url(#shadow)" />

  <line x1="680" y1="106" x2="680" y2="526" stroke="#456195" stroke-opacity="0.45" />

  <rect x="108" y="98" width="186" height="44" rx="22" fill="#5bd2ea" fill-opacity="0.14" stroke="#5bd2ea" stroke-opacity="0.36" />
  <text x="201" y="127" text-anchor="middle" fill="#9aefff" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700">
    AI-native
  </text>

  <text x="108" y="238" fill="#f7fbff" font-family="'Segoe UI', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-1">
    PMSync
  </text>
  <text x="108" y="298" fill="#d4e3fc" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="730">
    AI workspace for
  </text>
  <text x="108" y="356" fill="#d4e3fc" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="730">
    inbox teams
  </text>
  <text x="108" y="405" fill="#9fb5d9" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="520">
    Triage, draft, and automate operations faster.
  </text>

  <rect x="108" y="438" width="382" height="72" rx="18" fill="url(#brand)" />
  <text x="299" y="484" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="720">
    Create workspace
  </text>

  <rect x="726" y="130" width="364" height="286" rx="26" fill="#122446" stroke="#6784bb" stroke-opacity="0.42" />
  <rect x="758" y="171" width="300" height="32" rx="9" fill="#1b2e53" />
  <rect x="758" y="218" width="300" height="32" rx="9" fill="#1b2e53" />
  <rect x="758" y="265" width="300" height="32" rx="9" fill="#1b2e53" />
  <rect x="758" y="312" width="300" height="32" rx="9" fill="#1b2e53" />
  <circle cx="783" cy="187" r="8" fill="#5bd2ea" />
  <circle cx="783" cy="234" r="8" fill="#7760d9" />
  <circle cx="783" cy="281" r="8" fill="#c14ab5" />
  <circle cx="783" cy="328" r="8" fill="#5bd2ea" />

  <rect x="726" y="440" width="364" height="82" rx="15" fill="#13274c" stroke="#6582b8" stroke-opacity="0.34" />
  <text x="754" y="474" fill="#afd3ff" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="760">
    63% less manual triage
  </text>
  <text x="754" y="504" fill="#93add3" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="520">
    Trusted by 1,200+ operations teams
  </text>
</svg>
