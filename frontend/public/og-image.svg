  </text>

  <rect x="760" y="120" width="326" height="256" rx="24" fill="#122141" stroke="#6683b8" stroke-opacity="0.38" />
  <rect x="790" y="160" width="266" height="28" rx="8" fill="#1a2b4a" />
  <rect x="790" y="202" width="266" height="28" rx="8" fill="#1a2b4a" />
  <rect x="790" y="244" width="266" height="28" rx="8" fill="#1a2b4a" />
  <rect x="790" y="286" width="266" height="28" rx="8" fill="#1a2b4a" />
  <circle cx="814" cy="174" r="7" fill="#55cae5" />
  <circle cx="814" cy="216" r="7" fill="#7650ce" />
  <circle cx="814" cy="258" r="7" fill="#b43db6" />
  <circle cx="814" cy="300" r="7" fill="#55cae5" />

