  </text>

  <rect x="110" y="408" width="360" height="66" rx="16" fill="url(#brand)" />
  <text x="290" y="451" text-anchor="middle" fill="#ffffff" font-family="Roboto, Arial, sans-serif" font-size="32" font-weight="700">
