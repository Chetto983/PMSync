<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PMSync - Offline</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c1017;
      color: #f8fafc;
    }

    .container {
      text-align: center;
      max-width: 28rem;
      padding: 16px;
    }

    .brand {
      font-size: 2.25rem;
      font-weight: 600;
      line-height: 1.25;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #55cae5, #7650ce);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .heading {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.375;
      margin-bottom: 8px;
    }

    .description {
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1.625;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .button {
      font-size: 0.875rem;
      font-weight: 600;
      line-height: 1.5;
      padding: 8px 24px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #55cae5;
      color: #0c1017;
    }

    .button:hover {
      opacity: 0.9;
    }

    @media (prefers-color-scheme: light) {
      body {
        background: #f8fafc;
        color: #0f172a;
      }

      .description {
        color: #475569;
      }

      .button {
        background: #00aced;
        color: #ffffff;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">PMSync</div>
    <h1 class="heading">You're Offline</h1>
    <p class="description">It looks like you've lost your internet connection. Some features may be unavailable until you're back online.</p>
    <button class="button" onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
