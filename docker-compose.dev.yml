services:
  # =============================================
  # CORE SERVICES (always running for local dev)
  # =============================================

  redis:
    image: redis:7-alpine
    container_name: pmsync-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-pmsync_dev_redis}
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-pmsync_dev_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pmsync-net

  # =============================================
  # OPTIONAL: Local PostgreSQL (profile: db)
  # Use when NOT connecting to Neon cloud DB
  # Start with: docker compose -f docker-compose.dev.yml --profile db up
  # =============================================

  postgres:
    profiles: ["db"]
    build:
      context: ./database
      dockerfile: Dockerfile.postgres
    image: pmsync-postgres:citus-pgvector
    container_name: pmsync-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-mailuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mailpass}
      POSTGRES_DB: ${DB_NAME:-pmsync}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mailuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pmsync-net

  pgadmin:
    profiles: ["db"]
    image: dpage/pgadmin4:latest
    container_name: pmsync-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@pmsync.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    depends_on:
      - postgres
    networks:
      - pmsync-net

  # =============================================
  # OPTIONAL: SMTP testing (profile: mail)
  # Start with: docker compose -f docker-compose.dev.yml --profile mail up
  # =============================================

  mailhog:
    profiles: ["mail"]
    image: mailhog/mailhog:latest
    container_name: pmsync-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - pmsync-net

  # =============================================
  # OPTIONAL: Ngrok tunnel (profile: tunnel)
  # Start with: docker compose -f docker-compose.dev.yml --profile tunnel up
  # =============================================

  ngrok:
    profiles: ["tunnel"]
    image: ngrok/ngrok:latest
    container_name: pmsync-ngrok
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: >
      http host.docker.internal:3000
    ports:
      - "4040:4040"
    networks:
      - pmsync-net

  # =============================================
  # OPTIONAL: Monitoring (profile: monitoring)
  # Start with: docker compose -f docker-compose.dev.yml --profile monitoring up
  # =============================================

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: pmsync-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=15d'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pmsync-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    container_name: pmsync-grafana
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pmsync-net

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  pmsync-net:
    driver: bridge
