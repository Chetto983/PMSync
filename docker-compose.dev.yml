services:
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile.postgres
    image: mailagent-postgres:citus-pgvector
    container_name: mailagent-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-mailuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mailpass}
      POSTGRES_DB: ${DB_NAME:-mailagent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mailagent-net

  redis:
    image: redis:7-alpine
    container_name: mailagent-redis
    # Enable authentication and secure defaults
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-mailagent_dev_redis}
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mailagent_dev_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mailagent_dev_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mailagent-net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailagent-mailhog
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    networks:
      - mailagent-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mailagent-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@mailagent.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    depends_on:
      - postgres
    networks:
      - mailagent-net

  rgrock:
    image: ngrok/ngrok:latest
    container_name: mailagent-rgrock
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    # Use dynamic URL (free plan) - check logs for actual URL
    # For paid plans with custom domain, use: http --url=${NGROK_URL} host.docker.internal:3000
    command: >
      http host.docker.internal:3000
    ports:
      - "4040:4040"  # ngrok web interface to see the URL
    networks:
      - mailagent-net

  minio:
    image: minio/minio:latest
    container_name: mailagent-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_REGION_NAME: ${MINIO_REGION_NAME:-us-east-1}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://localhost:9000}
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"  # S3 API (shifted to avoid local conflicts)
      - "9101:9001"  # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mailagent-net

  prometheus:
    image: prom/prometheus:latest
    container_name: mailagent-prometheus
    ports:
      - "9090:9090"  # Prometheus UI
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=15d'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mailagent-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: mailagent-grafana
    ports:
      - "3030:3000"  # Grafana UI (shifted to avoid conflict with backend)
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mailagent-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  mailagent-net:
    driver: bridge
