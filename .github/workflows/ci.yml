name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (type-check, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve diff base SHA
        id: diffbase
        working-directory: ${{ github.workspace }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || echo "")
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Migration safety check (Guard A/D)
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ steps.diffbase.outputs.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "No base ref — skipping migration safety check."
            exit 0
          fi
          ADDED=$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- 'backend/prisma/migrations/**/migration.sql' || true)
          if [ -z "$ADDED" ]; then
            echo "No new migration files in this diff."
            exit 0
          fi
          echo "Checking new migrations:"
          echo "$ADDED"
          echo "$ADDED" | xargs node backend/scripts/check-migration-safety.js

      - name: Schema/migration sync check (Guard E)
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ steps.diffbase.outputs.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "No base ref — skipping schema/migration sync check."
            exit 0
          fi
          node backend/scripts/check-schema-migration-sync.js --base "$BASE_SHA"

      - name: Prod DB identifier scan (Guard G)
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ steps.diffbase.outputs.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "No base ref — skipping prod URL scan."
            exit 0
          fi
          # Only scan ADDED lines (`+` prefix) in source/config. Excludes docs
          # and CI/hooks that legitimately reference the patterns as metadata.
          PATTERN="ballast\.proxy\.rlwy\.net|postgresql://[^\"' ]+(rlwy\.net|railway\.app)"
          HITS=$(git diff "$BASE_SHA" HEAD -U0 -- ':!*.md' ':!.husky/**' ':!.github/workflows/**' | grep -E "^\+[^+]" | grep -iE "$PATTERN" || true)
          if [ -n "$HITS" ]; then
            echo "::error::Production DB identifier detected in added source/config lines"
            echo "$HITS" | head -10
            exit 1
          fi
          echo "No prod DB identifiers found in added source/config lines."

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: NODE_OPTIONS=--max-old-space-size=8192 npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Jest unit tests
        run: npx jest --passWithNoTests --ci --forceExit

      - name: Dependency boundary check
        run: |
          npx depcruise --config .dependency-cruiser.cjs \
            --ignore-known .dependency-cruiser-known-violations.json src
          echo "--- Circular dependency report ---"
          npx madge --circular --extensions ts --ts-config tsconfig.json src || true

      - name: Generate OpenAPI spec
        id: openapi-gen
        run: npx ts-node scripts/generate-openapi.ts
        continue-on-error: true

      - name: Lint OpenAPI spec
        if: steps.openapi-gen.outcome == 'success' && hashFiles('backend/openapi-spec.json') != ''
        run: |
          npx spectral lint ./openapi-spec.json --ruleset .spectral.yaml

      - name: Contract tests (API drift detection)
        if: steps.openapi-gen.outcome == 'success' && hashFiles('backend/openapi-spec.json') != ''
        run: npm run contract-test

      - name: Generate frontend types from OpenAPI
        if: steps.openapi-gen.outcome == 'success' && hashFiles('backend/openapi-spec.json') != ''
        run: |
          cd ../frontend
          npx openapi-typescript ../backend/openapi-spec.json -o types/api.generated.ts

  frontend:
    name: Frontend (type-check, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Jest unit tests
        run: npx jest --passWithNoTests --ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: Bundle size budget check
        run: |
          SIZE=$(du -sb .next/static/chunks/ | cut -f1)
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          echo "Bundle size: ${SIZE_MB}MB"
          WARN_LIMIT=9437184
          FAIL_LIMIT=10485760
          if [ "$SIZE" -gt "$FAIL_LIMIT" ]; then
            echo "::error::Bundle size ${SIZE_MB}MB exceeds 10MB budget"
            exit 1
          elif [ "$SIZE" -gt "$WARN_LIMIT" ]; then
            echo "::warning::Bundle size ${SIZE_MB}MB approaching 10MB budget"
          fi
