name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (type-check, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: NODE_OPTIONS=--max-old-space-size=8192 npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Jest unit tests
        run: npx jest --passWithNoTests --ci --forceExit

      - name: Dependency boundary check
        run: |
          npx depcruise --config .dependency-cruiser.cjs \
            --ignore-known .dependency-cruiser-known-violations.json src
          echo "--- Circular dependency report ---"
          npx madge --circular --extensions ts --ts-config tsconfig.json src || true

      - name: Generate OpenAPI spec
        id: openapi-gen
        run: npx ts-node scripts/generate-openapi.ts
        continue-on-error: true

      - name: Lint OpenAPI spec
        if: steps.openapi-gen.outcome == 'success' && hashFiles('backend/openapi-spec.json') != ''
        run: |
          npx spectral lint ./openapi-spec.json --ruleset .spectral.yaml

      - name: Generate frontend types from OpenAPI
        if: steps.openapi-gen.outcome == 'success' && hashFiles('backend/openapi-spec.json') != ''
        run: |
          cd ../frontend
          npx openapi-typescript ../backend/openapi-spec.json -o types/api.generated.ts

  frontend:
    name: Frontend (type-check, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Jest unit tests
        run: npx jest --passWithNoTests --ci
