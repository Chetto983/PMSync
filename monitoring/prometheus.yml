global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MailAgent Backend Metrics (running on host)
  - job_name: 'mailagent-backend'
    metrics_path: /health/metrics
    scheme: http
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      - targets:
          - host.docker.internal:3000
        labels:
          service: backend
          environment: development

  # Queue Health Metrics
  - job_name: 'mailagent-queues'
    metrics_path: /health/metrics
    scheme: http
    scrape_interval: 30s
    static_configs:
      - targets:
          - host.docker.internal:3000
        labels:
          component: queues

  # Redis Metrics (future - add redis-exporter)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # PostgreSQL Metrics (future - add postgres-exporter)
